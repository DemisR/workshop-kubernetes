<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kubernetes Workshop</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Georgia, "Times New Roman", serif;
        color: #172121;
        background: #f3f0e8;
      }

      body {
        margin: 0;
      }

      main {
        width: min(52rem, calc(100% - 2rem));
        margin: 0 auto;
        padding: clamp(3rem, 10vw, 7rem) 0;
      }

      h1 {
        max-width: 10ch;
        margin: 0 0 3rem;
        font-size: clamp(3rem, 10vw, 6.5rem);
        font-weight: 400;
        line-height: 0.92;
        letter-spacing: 0;
      }

      ol {
        margin: 0;
        padding: 0;
        border-top: 1px solid #172121;
        list-style: none;
        counter-reset: deck;
      }

      li {
        counter-increment: deck;
        border-bottom: 1px solid #172121;
      }

      a {
        display: grid;
        grid-template-columns: 3rem 1fr auto;
        gap: 1rem;
        align-items: center;
        min-height: 5rem;
        color: inherit;
        text-decoration: none;
      }

      a::before {
        content: "0" counter(deck);
        font-family: ui-monospace, monospace;
        font-size: 0.75rem;
      }

      a::after {
        content: "\2192";
        font-size: 1.5rem;
      }

      a:hover,
      a:focus-visible {
        color: #b53a22;
      }

      @media (max-width: 32rem) {
        a {
          grid-template-columns: 2rem 1fr auto;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Kubernetes Workshop</h1>
      <nav aria-label="Workshop slide decks">
        <ol>
          <li><a href="01-kubernetes-concepts/">Kubernetes concepts</a></li>
          <li><a href="02-kubernetes-resources/">Kubernetes resources</a></li>
          <li><a href="03-kubernetes-cli/">Kubernetes CLI</a></li>
          <li><a href="04-kubernetes-deployments/">Kubernetes deployments</a></li>
        </ol>
      </nav>
    </main>
  </body>
</html>
